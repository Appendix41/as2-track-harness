name: Bug report
description: Report a reproducible defect in AS2 Track Harness
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, tokens, private IP addresses, customer images or
        robot serial numbers. For security issues use the private advisory
        process in SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands, config file (redacted) and the smallest input that shows the problem.
      placeholder: |
        PYTHON=python3.11 bash scripts/test.sh
        ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Test tail, JSONL record or dashboard state. Redact paths and keys.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 / commit sha
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Unit tests / offline replay
        - Mock shadow run
        - Shadow run with the real planner
        - Observation dashboard
        - Dry-run executor
        - Real robot execution (--execute)
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This report does not contain credentials or private network details.
          required: true
