name: Feature request
description: Suggest a capability or an experiment for AS2 Track Harness
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Execution, arming and robot RPC are intentionally opt-in. Feature
        requests that make motion the default will be declined.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How would you change the harness? Which module, contract or config key is involved?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Does it change command bounds, telemetry gates, the watchdog, the control lease or the default mode?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read docs/ARCHITECTURE.md and docs/SAFETY.md.
          required: true
        - label: This request keeps execution disabled by default.
          required: true
