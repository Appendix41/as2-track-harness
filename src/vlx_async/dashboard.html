<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VLX × DeepSeek · 任务级规划</title>
<style>
body{margin:0;background:#111827;color:#e5e7eb;font:15px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:26px}h1{font-size:26px;margin:0 0 10px}.tag{display:inline-block;padding:6px 12px;border:1px solid #4b5563;border-radius:20px;color:#93c5fd;margin-right:8px}.muted{color:#aeb8c8}section{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:18px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}canvas{width:100%;height:auto;background:#0d1526;border-radius:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:22px;margin-top:6px}h2{font-size:17px;margin:0 0 12px}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin:12px 0}pre{white-space:pre-wrap;word-break:break-word;font:13px ui-monospace,monospace}.warn{color:#fbbf24}.error{color:#fca5a5}label{cursor:pointer}.progress{height:9px;border-radius:6px;background:#0d1526;border:1px solid #374151;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#2f7f68,#5be0ba);width:0}@media(max-width:750px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
<main><h1>VLX × DeepSeek · 任务级规划</h1><span class="tag">影子运行 · 不发送运动命令</span><span id="provider" class="tag">等待数据</span>
<p id="notice" class="muted">每个任务只在起步前请求一次 DeepSeek；执行中不再推理。深度链路已删除。</p>
<section class="stats"><div class="stat">本地循环<b id="hz">—</b></div><div class="stat">VLX 输出频率<b id="sourceHz">—</b></div><div class="stat">本任务 DeepSeek 调用<b id="calls">—</b></div><div class="stat">剩余路线<b id="remaining">—</b></div></section>
<section><div id="status" class="warn">正在连接…</div><p id="instruction"></p><div id="worker" class="muted"></div><div class="progress"><span id="bar"></span></div><p id="plan" class="muted"></p></section>
<div class="grid"><section><h2>机身坐标 · 米</h2><canvas id="map" width="640" height="480"></canvas><div class="legend"><label style="color:#60a5fa"><input type="checkbox" data-layer="fast" checked>VLX 原航点</label><label style="color:#c084fc"><input type="checkbox" data-layer="plan_aligned" checked>计划路线</label><label style="color:#34d399"><input type="checkbox" data-layer="recommended" checked>建议轨迹</label></div><p class="muted">路线由图像坐标经相机高度与内参投影；到达按沿路线的里程判定。</p></section>
<section><h2>规划帧图像与像素路线</h2><canvas id="image" width="640" height="480"></canvas><p id="imageNote" class="muted">等待本任务计划帧</p></section></div>
<section><h2>决策诊断</h2><pre id="detail"></pre></section></main>
<script>
const $=id=>document.getElementById(id), layers=new Set(['fast','plan_aligned','recommended']);
const reasons={plan_pending:'等待 DeepSeek 规划',task_ready:'计划就绪 · 执行中',route_completed:'已到达任务终点',route_drift:'偏离计划路线',plan_requires_reverse:'计划要求掉头',plan_route_above_horizon:'路线落在地平线以上',low_plan_confidence:'计划置信度不足',pose_unavailable:'缺少里程计位姿',odometry_frame_changed:'里程计坐标系变化',plan_timeout:'规划超时',plan_not_ready:'计划未就绪',invalid_vlx_path:'VLX 路径无效',camera_frame_stale:'相机帧过期',prediction_stale:'VLX 预测过期',source_not_running:'VLX 尚未就绪'};
let latest=null, imageKey=null, loadedImage=null;
document.querySelectorAll('[data-layer]').forEach(e=>e.onchange=()=>{e.checked?layers.add(e.dataset.layer):layers.delete(e.dataset.layer);if(latest)render(latest)});
function plot(canvas, series){const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height;c.clearRect(0,0,w,h);let extent=1;for(const [pts] of series)for(const p of pts||[])extent=Math.max(extent,Math.abs(p[0]),Math.abs(p[1]));extent=Math.ceil(extent*1.2);const s=Math.min(w*.42,h*.75)/extent,ox=w/2,oy=h*.85;c.strokeStyle='#334155';c.lineWidth=1;for(let v=-extent;v<=extent;v++){c.beginPath();c.moveTo(0,oy-v*s);c.lineTo(w,oy-v*s);c.stroke();c.beginPath();c.moveTo(ox-v*s,0);c.lineTo(ox-v*s,h);c.stroke()}c.fillStyle='#9ca3af';c.font='13px sans-serif';c.fillText('↑ 前方 x；← 左侧 y；网格 1 m',12,22);for(const [pts,color,dashed] of series){if(!pts||!pts.length)continue;c.strokeStyle=color;c.lineWidth=3;c.setLineDash(dashed?[7,5]:[]);c.beginPath();pts.forEach((p,i)=>{const x=ox-p[1]*s,y=oy-p[0]*s;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.setLineDash([]);c.fillStyle=color;for(const p of pts){c.beginPath();c.arc(ox-p[1]*s,oy-p[0]*s,3,0,Math.PI*2);c.fill()}}c.fillStyle='#fff';c.beginPath();c.arc(ox,oy,5,0,Math.PI*2);c.fill()}
function drawImage(s){const canvas=$('image'),c=canvas.getContext('2d');c.clearRect(0,0,640,480);if(loadedImage&&s.image_request_id===imageKey)c.drawImage(loadedImage,0,0,640,480);if(s.plan_request_id&&s.plan_request_id===s.image_request_id){c.strokeStyle='#fbbf24';c.lineWidth=3;c.beginPath();(s.request_waypoints_uv||[]).forEach((p,i)=>i?c.lineTo(p[0]*640,p[1]*480):c.moveTo(p[0]*640,p[1]*480));c.stroke()}}
function render(s){latest=s;const task=s.task||{};$('provider').textContent=(s.slow_worker&&s.slow_worker.provider)||s.mode||'等待';$('hz').textContent=s.loop_hz?`${s.loop_hz.toFixed(1)} Hz`:'—';$('sourceHz').textContent=s.source_hz?`${s.source_hz.toFixed(2)} Hz`:'—';$('calls').textContent=`${task.plan_calls??0} / 1`;$('remaining').textContent=task.remaining_route_m!=null?`${task.remaining_route_m.toFixed(2)} m`:'—';$('status').textContent=reasons[s.reason]||s.reason||s.status;$('instruction').textContent=`任务：${s.instruction||'—'}　帧：${s.camera_index??'—'}`;$('worker').textContent=`阶段：${task.phase||'—'}　规划：${s.plan_status||'—'}　${(s.slow_worker&&s.slow_worker.error)||''}`;$('bar').style.width=`${Math.max(0,Math.min(1,task.progress_fraction||0))*100}%`;$('plan').textContent=s.plan_description||'';plot($('map'),[['fast','#60a5fa',false],['plan_aligned','#c084fc',true],['recommended','#34d399',false]].filter(([k])=>layers.has(k)).map(([k,c,d])=>[s[k],c,d]));$('imageNote').textContent=s.plan_request_id?`计划请求：${s.plan_request_id}`:'等待本任务计划帧';if(s.image_base64&&imageKey!==s.image_request_id){imageKey=s.image_request_id;const key=imageKey,img=new Image();img.onload=()=>{if(imageKey===key){loadedImage=img;drawImage(latest)}};img.src='data:image/jpeg;base64,'+s.image_base64}else drawImage(s);$('detail').textContent=JSON.stringify({phase:task.phase,reason:s.reason,selection:s.selection,plan_status:s.plan_status,plan_request_id:s.plan_request_id,remaining_route_m:s.remaining_route_m,total_route_m:s.total_route_m,cross_track_m:s.cross_track_m,progress_fraction:s.progress_fraction,chosen_angle_rad:s.chosen_angle_rad,last_rejection:s.last_rejection,plan_calls:task.plan_calls,api_latency_s:s.latency_s},null,2)}
async function poll(){try{const r=await fetch('/state.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.json();render(s);if(s.report_notice)$('notice').textContent=s.report_notice}catch(e){$('status').textContent='实验服务连接中断';$('status').className='error'}setTimeout(poll,500)}poll();
</script></html>
